[project]
name = "pii-server"
version = "0.1.0"
requires-python = ">=3.11.9"
dependencies = [
    "datasets>=2.21,<3",
    "detect-secrets>=1.5.0",
    "gibberish-detector>=0.1.1",
    "jaxtyping>=0.3.11",
    "pyperclip>=1.11.0",
    "regex>=2026.7.19",
    "seqeval>=1.2.2",
    "transformers<5",
]

[project.scripts]
pii_server = "pii_server.cli:main"

[project.optional-dependencies]
mlx = [
    "mlx>=0.32.2 ; sys_platform == 'darwin'",
    "torch>=2.13.0 ; sys_platform == 'darwin'",
]
vllm = [
    "vllm==0.19.0 ; sys_platform != 'darwin'",
]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatch.build]
include = ["pii_server/*"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.4",
]
